name: marketplace-verify

on:
  push:
    branches: [master]
    paths:
      - manifest.json
  workflow_dispatch:

jobs:
  request-verify:
    name: request-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-10-04
        with:
          fetch-depth: 2
      - name: Request marketplace verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: bash .github/scripts/request-marketplace-verify.sh
